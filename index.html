<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hari Hari Puzzle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kawaii offline logic puzzles with Hari the hedgehog">
<meta name="theme-color" content="#ffb3c8">
<!--build:remove-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!--/build:remove-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Mochiy+Pop+One&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<canvas id="bgCanvas" class="bg" aria-hidden="true"></canvas>
<div class="hills" aria-hidden="true">
  <svg class="hill h2" viewBox="0 0 1600 120" preserveAspectRatio="none"><path d="M0 52Q100 14 200 52T400 52T600 52T800 52T1000 52T1200 52T1400 52T1600 52V120H0Z"/></svg>
  <svg class="hill h1" viewBox="0 0 1600 120" preserveAspectRatio="none"><path d="M0 70Q133 38 266 70T533 70T800 70T1066 70T1333 70T1600 70V120H0Z"/></svg>
</div>
<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="lnOn" cx="50%" cy="40%" r="62%"><stop offset="0" style="stop-color:var(--ln-on-1)"/><stop offset=".5" style="stop-color:var(--ln-on-2)"/><stop offset="1" style="stop-color:var(--ln-on-3)"/></radialGradient>
  <radialGradient id="lnOff" cx="50%" cy="40%" r="62%"><stop offset="0" style="stop-color:var(--ln-off-1)"/><stop offset=".6" style="stop-color:var(--ln-off-2)"/><stop offset="1" style="stop-color:var(--ln-off-3)"/></radialGradient>
  <radialGradient id="lnHalo"><stop offset="0" style="stop-color:var(--lantern-glow);stop-opacity:.8"/><stop offset="1" style="stop-color:var(--lantern-glow);stop-opacity:0"/></radialGradient>
</defs></svg>
<div class="app">
  <header class="topbar">
    <div class="brand" id="brand"><span class="brand-name">Hari Hari</span></div>
    <div class="actions">
      <button id="installBtn" class="pill accent" hidden></button>
      <button id="scoreChip" class="pill score" aria-haspopup="dialog"></button>
      <button id="musicBtn" class="icon-btn" aria-label="Music"></button>
      <button id="soundBtn" class="icon-btn" aria-label="Sound"></button>
      <button id="langBtn" class="pill" aria-haspopup="dialog"></button>
    </div>
  </header>
  <main id="home"></main>
  <main id="game" hidden></main>
</div>
<div id="langDlg" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="langTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="langTitle">Language</h2><button class="icon-btn close" aria-label="Close">✕</button></div>
    <div id="langList" class="lang-list"></div>
  </div>
</div>
<div id="statsDlg" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="statsTitle">
  <div class="sheet">
    <div class="sheet-head"><h2 id="statsTitle">Progress</h2><button id="statsClose" class="icon-btn close" aria-label="Close">✕</button></div>
    <div id="statsBody" class="stats-body"></div>
  </div>
</div>
<div id="winDlg" class="overlay" hidden role="dialog" aria-modal="true"><div id="winBox" class="win-box"></div></div>
<div id="loseDlg" class="overlay" hidden role="dialog" aria-modal="true"><div id="loseBox" class="win-box lose-box"></div></div>
<div id="hariSay" class="say" hidden aria-live="polite"><p></p></div>
<canvas id="fxCanvas" class="fx" aria-hidden="true"></canvas>

<script src="src/i18n/locales.js"></script>
<script src="src/core/rng.js"></script>
<script src="src/core/core.js"></script>
<script src="src/core/mascot.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/fx.js"></script>
<script src="src/games/hedgedoku-logic.js"></script>
<script src="src/games/hedgedoku-ui.js"></script>
<script src="src/games/boba-logic.js"></script>
<script src="src/games/boba-ui.js"></script>
<script src="src/games/lantern-logic.js"></script>
<script src="src/games/lantern-ui.js"></script>
<script src="src/app.js"></script>
</body>
</html>
